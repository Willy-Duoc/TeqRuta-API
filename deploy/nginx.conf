# Nginx de producción: TLS obligatorio y proxy hacia Gunicorn.
# Los certificados se montan en /etc/nginx/certs (fullchain.pem + privkey.pem).

limit_req_zone $binary_remote_addr zone=teqruta_api:10m rate=20r/s;

upstream teqruta_api {
    server api:8000;
    keepalive 16;
}

# HTTP solo para redirigir a HTTPS (incluye ACME si se usa Let's Encrypt).
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No revelar versión ni tecnología en errores.
    server_tokens off;

    client_max_body_size 16m;
    client_body_timeout 30s;
    keepalive_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # La raíz lleva al panel administrativo; la API está bajo /api.
    location = / {
        return 302 /admin/;
    }

    location /api/ {
        limit_req zone=teqruta_api burst=40 nodelay;
        proxy_pass http://teqruta_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /admin/ {
        limit_req zone=teqruta_api burst=40 nodelay;
        proxy_pass http://teqruta_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /static/ {
        proxy_pass http://teqruta_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Todo lo demás no existe en esta aplicación.
    location / {
        return 404;
    }
}
